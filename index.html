        const interactiveSessions = {
            "01": "featured%20lectures/L1/backend-concepts.html",
            "05": "featured%20lectures/L5/array-methods.html"
        };

        const statusLabels = {
            completed: "Completed",
            upcoming: "Upcoming",
            "in-progress": "In Progress",
            "not-started": "Not Started"
        };

        lectures.forEach(lecture => {
            const lectureNumber = Number.parseInt(lecture.number, 10);
            lecture.status = lectureNumber <= 5
                ? "completed"
                : lectureNumber === 6
                    ? "upcoming"
                    : "not-started";
        });

        function getVisibleLectures() {
            return lectures.filter(lecture =>
                lecture.status === "completed" ||
                lecture.status === "upcoming" ||
                lecture.status === "in-progress"
            );
        }

        const modal = document.getElementById('ideasModal');
        const modalNumber = document.getElementById('modalNumber');
        const modalTitle = document.getElementById('modalTitle');
        const modalIdeas = document.getElementById('modalIdeas');
        const modalClose = document.getElementById('modalClose');

        function openIdeasModal(lecture) {
            modalNumber.textContent = `Lecture ${lecture.number}`;
            modalTitle.textContent = lecture.title;
            modalIdeas.innerHTML = '';

            const ideas = lecture.ideas && lecture.ideas.length
                ? lecture.ideas
                : lecture.topics.split(',').map(t => t.trim()).filter(Boolean);

            ideas.forEach(idea => {
                const li = document.createElement('li');
                li.textContent = idea;
                modalIdeas.appendChild(li);
            });

            modal.hidden = false;
            document.body.classList.add('modal-open');
        }

        function closeIdeasModal() {
            modal.hidden = true;
            document.body.classList.remove('modal-open');
        }

        function generateLectureRows(lecturesArray) {
            const tableBody = document.getElementById('lectures-table-body');
            tableBody.innerHTML = '';

            for (let lecture of lecturesArray) {
                const row = document.createElement('tr');
                row.onclick = () => openIdeasModal(lecture);

                const numberCell = document.createElement('td');
                numberCell.textContent = lecture.number;

                const titleCell = document.createElement('td');
                const titleSpan = document.createElement('span');
                titleSpan.className = 'lecture-link';
                titleSpan.textContent = lecture.title;
                titleCell.appendChild(titleSpan);

                const topicsCell = document.createElement('td');
                topicsCell.textContent = lecture.topics;

                const statusCell = document.createElement('td');
                const statusBadge = document.createElement('span');
                statusBadge.className = `status-badge status-${lecture.status}`;
                statusBadge.textContent = statusLabels[lecture.status];
                statusCell.appendChild(statusBadge);

                const sessionCell = document.createElement('td');
                sessionCell.className = 'session-cell';
                const sessionPath = interactiveSessions[lecture.number];

                if (sessionPath) {
                    const sessionLink = document.createElement('a');
                    sessionLink.className = 'interactive-session-button';
                    sessionLink.href = sessionPath;
                    sessionLink.textContent = 'Interactive Session';
                    sessionLink.setAttribute('aria-label', `Open interactive session for Lecture ${lecture.number}: ${lecture.title}`);
                    sessionLink.addEventListener('click', event => event.stopPropagation());
                    sessionCell.appendChild(sessionLink);
                } else {
                    const unavailable = document.createElement('span');
                    unavailable.className = 'session-unavailable';
                    unavailable.textContent = '—';
                    unavailable.setAttribute('aria-label', 'No interactive session available');
                    sessionCell.appendChild(unavailable);
                }

                row.appendChild(numberCell);
                row.appendChild(titleCell);
                row.appendChild(topicsCell);
                row.appendChild(statusCell);
                row.appendChild(sessionCell);
                tableBody.appendChild(row);
            }
        }

        generateLectureRows(getVisibleLectures());

        document.getElementById('searchInput').addEventListener('keyup', function() {
            const searchText = this.value.toLowerCase();
            const filteredLectures = getVisibleLectures().filter(lecture => {
                return lecture.title.toLowerCase().includes(searchText) ||
                    lecture.topics.toLowerCase().includes(searchText) ||
                    lecture.number.toLowerCase().includes(searchText) ||
                    (lecture.ideas || []).some(idea => idea.toLowerCase().includes(searchText));
            });
            generateLectureRows(filteredLectures);
        });

        modalClose.addEventListener('click', closeIdeasModal);
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeIdeasModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !modal.hidden) closeIdeasModal();
        });
